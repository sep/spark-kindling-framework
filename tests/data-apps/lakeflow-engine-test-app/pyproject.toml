[tool.poetry]
name = "lakeflow-engine-test-app"
version = "0.1.0"
description = "System-test data app: general Lakeflow SDP execution path (overlays, dependency inference, materialized views, expectations)"
authors = ["Kindling Team"]
packages = [{ include = "lakeflow_engine_app" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.plugins."spark_kindling.data_apps"]
lakeflow_engine = "lakeflow_engine_app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
