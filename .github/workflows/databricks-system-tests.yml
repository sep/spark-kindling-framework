name: Databricks System Tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Optional poe system test name (for example: name_mapper, default_telemetry, streaming_pipes). Ignored when 'extension' is set."
        required: false
        default: ""
      extension:
        description: "Optional extension name to run tests/system/extensions/<name> instead of core (for example: databricks)"
        required: false
        default: ""
      ref:
        description: "Git ref to test"
        required: false
        default: "main"

jobs:
  databricks-system-tests:
    name: Databricks System Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sep/spark-kindling-framework/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Activate virtualenv and install project
        run: |
          cd /workspace
          . .venv/bin/activate
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          pip install -e .

      - name: Resolve candidate storage path
        id: base-path
        run: |
          base_path="workflow-dispatch/${{ github.run_id }}"
          echo "azure_base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "Using AZURE_BASE_PATH=$base_path"

      - name: Build framework wheel
        run: |
          chmod +x scripts/build_platform_wheels.sh
          bash scripts/build_platform_wheels.sh
          cp runtime/scripts/kindling_bootstrap.py dist/kindling_bootstrap.py
          ls -lh dist/

      - name: Deploy candidate wheel to isolated path
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}
          AZURE_BASE_PATH: ${{ steps.base-path.outputs.azure_base_path }}
        run: |
          python scripts/deploy.py

      - name: Resolve Databricks UC config
        env:
          DEFAULT_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DEFAULT_DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
          UC_VOLUME_CATALOG: ${{ vars.KINDLING_DATABRICKS_RUNTIME_VOLUME_CATALOG }}
          UC_VOLUME_SCHEMA: ${{ vars.KINDLING_DATABRICKS_RUNTIME_VOLUME_SCHEMA }}
          UC_TEMP_VOLUME: ${{ vars.KINDLING_DATABRICKS_RUNTIME_TEMP_VOLUME }}
        run: |
          echo "DATABRICKS_HOST=$DEFAULT_DATABRICKS_HOST" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLUSTER_ID=$DEFAULT_DATABRICKS_CLUSTER_ID" >> "$GITHUB_ENV"
          echo "KINDLING_DATABRICKS_SYSTEM_TEST_MODE=uc" >> "$GITHUB_ENV"
          echo "KINDLING_DATABRICKS_RUNTIME_VOLUME_CATALOG=${UC_VOLUME_CATALOG:-kindling}" >> "$GITHUB_ENV"
          echo "KINDLING_DATABRICKS_RUNTIME_VOLUME_SCHEMA=${UC_VOLUME_SCHEMA:-kindling}" >> "$GITHUB_ENV"
          echo "KINDLING_DATABRICKS_RUNTIME_TEMP_VOLUME=${UC_TEMP_VOLUME:-artifacts}" >> "$GITHUB_ENV"
          echo "KINDLING_DATABRICKS_RUNTIME_TEMP_SUBDIR=ci-tests" >> "$GITHUB_ENV"

      - name: Run Databricks UC preflight
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}
        run: |
          python scripts/databricks_uc_preflight.py

      # test_lakeflow_scd_platform.py and test_temporal_lakeflow.py spin up
      # real serverless Lakeflow/DLT pipelines whose generated notebook does
      # a %pip install of exact-pinned wheels from a UC Volume path (Lakeflow
      # can't install from the abfss:// path the rest of this workflow uses).
      # Build the two test-app wheels and push the current commit's wheels
      # to that volume so the notebook's install step has something to find.
      - name: Build and deploy Lakeflow UC volume wheels
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          export PATH="/home/vscode/.local/bin:$PATH"
          export POETRY_CACHE_DIR="${POETRY_CACHE_DIR:-/tmp/poetry-cache}"
          export POETRY_VIRTUALENVS_PATH="${POETRY_VIRTUALENVS_PATH:-/tmp/poetry-virtualenvs}"
          export VIRTUALENV_OVERRIDE_APP_DATA="${VIRTUALENV_OVERRIDE_APP_DATA:-/tmp/virtualenv-app-data}"
          export XDG_DATA_HOME="${XDG_DATA_HOME:-/tmp/xdg-data}"
          mkdir -p "$POETRY_CACHE_DIR" "$POETRY_VIRTUALENVS_PATH" "$VIRTUALENV_OVERRIDE_APP_DATA" "$XDG_DATA_HOME"
          python scripts/deploy_lakeflow_uc_wheels.py

      - name: Run Databricks system tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages:$PYTHONPATH
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}
          AZURE_BASE_PATH: ${{ steps.base-path.outputs.azure_base_path }}
        run: |
          if [ -n "${{ inputs.extension }}" ]; then
            poe test-extension --extension "${{ inputs.extension }}" --platform databricks
          elif [ -n "${{ inputs.test }}" ]; then
            poe test-system --platform databricks --test "${{ inputs.test }}"
          else
            poe test-system-ci --platform databricks
          fi

      - name: Upload system test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: databricks-system-test-results
          path: test-results/
