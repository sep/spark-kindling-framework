kindling:
  platform:
    environment: databricks
  storage:
    table_schema: base_schema
  telemetry:
    logging:
      level: INFO

dataentities-bytag:
  tier:
    bronze:
      tags:
        provider.table_catalog: base_bronze
        retention.days: "3"
    silver:
      tags:
        provider.table_catalog: base_silver
        retention.days: "7"

dataentities:
  "bronze.**":
    tags:
      provider.table_catalog: base_bronze
      placement.source: base
  "silver.**":
    tags:
      provider.table_catalog: base_silver
      placement.source: base

datapipes:
  bronze.ingest_telemetry:
    tags:
      placement.source: base
