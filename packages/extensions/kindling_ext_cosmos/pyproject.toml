[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "spark-kindling-ext-cosmos"
version = "0.2.1"
description = "Azure Cosmos DB entity provider extension for Kindling"
authors = [{name = "SEP Engineering", email = "engineering@sep.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Kindling and Spark are provided by the target runtime. The Cosmos Spark
# connector is a JVM/Spark package and must be installed as a Maven coordinate
# on the pool -- one artifact per Spark line, see
# kindling_ext_cosmos.COSMOS_SPARK_CONNECTOR_MAVEN_COORDINATES.
#
# Spark-family install profiles, keyed by the Spark line you run rather than
# by platform (a Databricks cluster on Spark 4.0 and a standalone Spark 4.0
# use the same connector artifact):
#
#   spark-kindling-ext-cosmos[spark_3_x]  -> Spark 3.5 (Fabric, Synapse, standalone)
#   spark-kindling-ext-cosmos[spark_4_x]  -> Spark 4.0 / 4.1 (Databricks, standalone-4x)
#
# Each extra pins pyspark to its family for local/standalone environments,
# which is also what selects the connector coordinate reported by
# resolve_cosmos_spark_connector_coordinate(). Managed runtimes already
# provide pyspark, and Kindling's extension bootstrap installs the wheel
# without extras, so nothing here is required at import time: a bare install
# works on every platform. Never request both extras in one environment.
dependencies = []

[project.urls]
Homepage = "https://github.com/sep/spark-kindling-framework"
Documentation = "https://github.com/sep/spark-kindling-framework/tree/main/docs"
Changelog = "https://github.com/sep/spark-kindling-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/sep/spark-kindling-framework/issues"

[project.optional-dependencies]
spark_3_x = ["pyspark>=3.4.0,<4.0.0"]
spark_4_x = ["pyspark>=4.0.0,<4.2.0"]

[tool.uv.build-backend]
module-root = ""
module-name = "kindling_ext_cosmos"

[dependency-groups]
dev = ["pytest>=7.0.0", "black>=23.0.0"]
