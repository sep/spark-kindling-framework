[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "spark-kindling-ext-adx"
version = "0.1.0"
description = "Azure Data Explorer entity provider extension for Kindling"
authors = [{name = "SEP Engineering", email = "engineering@sep.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# Kindling and Spark are provided by the target runtime. The ADX Spark connector
# is a JVM/Spark package and must be installed as a Maven coordinate on the pool.
dependencies = []

[tool.uv.build-backend]
module-root = ""
module-name = "kindling_ext_adx"

[dependency-groups]
dev = ["pytest>=7.0.0", "black>=23.0.0"]
