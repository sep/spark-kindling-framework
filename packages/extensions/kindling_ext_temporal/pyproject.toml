[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "spark-kindling-ext-temporal"
version = "0.2.7"
description = "Temporal event, condition, and episode primitives for Kindling"
authors = [{name = "SEP Engineering", email = "engineering@sep.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# kindling and Spark are provided by the target runtime.
dependencies = []

[project.urls]
Homepage = "https://github.com/sep/spark-kindling-framework"
Documentation = "https://github.com/sep/spark-kindling-framework/tree/main/docs"
Changelog = "https://github.com/sep/spark-kindling-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/sep/spark-kindling-framework/issues"

[tool.uv.build-backend]
module-root = ""
module-name = "kindling_ext_temporal"

[dependency-groups]
dev = ["pytest>=7.0.0", "black>=23.0.0"]
