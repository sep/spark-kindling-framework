[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "spark-kindling-ext-databricks-autoloader"
version = "0.1.0"
description = "Databricks Auto Loader (cloudFiles) discovery extension for Kindling file ingestion"
authors = [{name = "SEP Engineering", email = "engineering@sep.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# cloudFiles is a Databricks-runtime Spark option, not a separate Python
# SDK -- this extension only needs core kindling, not
# spark-kindling-ext-databricks (that package is the unrelated Lakeflow
# SDP adapter; see docs/proposals/autoloader_file_ingestion.md
# for the extension boundary decision).
dependencies = ["spark-kindling>=0.10.0"]

[tool.uv.build-backend]
module-root = ""
module-name = "kindling_ext_databricks_autoloader"

[dependency-groups]
dev = ["pytest>=7.0.0", "black>=23.0.0"]
