[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "spark-kindling-ext-visualization"
version = "0.1.0"
description = "Matplotlib visualization extension for the Kindling framework"
authors = [{name = "SEP Engineering", email = "engineering@sep.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# kindling is provided by the runtime environment, not installed as a dependency.
# matplotlib is the render backend for this extension. Spark runtimes usually
# provide pandas already; DataFrame.toPandas() will surface a clear runtime
# error if a selected environment does not.
dependencies = ["matplotlib>=3.7.0"]

[tool.uv.build-backend]
module-root = ""
module-name = "kindling_ext_visualization"

[dependency-groups]
dev = ["pytest>=7.0.0", "black>=23.0.0"]
