[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "spark-kindling-sdk"
version = "0.13.1"
description = "Design-time platform SDK for Kindling"
authors = [{name = "SEP Engineering", email = "engineering@sep.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "azure-identity>=1.15.0",
    "azure-core>=1.30.0,<1.31.0",
    "azure-storage-file-datalake>=12.14.0",
    # >=0.20.0: Files API directory operations (files.list_directory_contents,
    # create_directory, delete_directory) used by the /Volumes artifact store.
    "databricks-sdk>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/sep/spark-kindling-framework"
Documentation = "https://github.com/sep/spark-kindling-framework/tree/main/docs"
Changelog = "https://github.com/sep/spark-kindling-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/sep/spark-kindling-framework/issues"

[tool.uv.build-backend]
module-root = ""
module-name = "kindling_sdk"
